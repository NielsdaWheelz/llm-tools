name: Publish llm-tools

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: false
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen pyright src tests
      - run: uv run --frozen pytest -q
      - run: uv build --no-sources
      - run: uv run --frozen pip-audit
      - run: uv publish --trusted-publishing always
