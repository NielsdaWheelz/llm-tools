[project]
name = "llm-tools"
version = "0.1.0"
description = "Provider-neutral typed tool kernel with safe Web and progressive discovery tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Niels-Erik Nandal", email = "nielseriknandal@gmail.com" },
]
keywords = ["llm", "tools", "web-search", "json-schema", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.11,<3",
    "rfc8785>=0.1.4,<1",
]

[project.urls]
Repository = "https://github.com/NielsdaWheelz/llm-tools"
Issues = "https://github.com/NielsdaWheelz/llm-tools/issues"
Security = "https://github.com/NielsdaWheelz/llm-tools/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tools"]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.8.0",
    "respx>=0.21.0",
    "ruff>=0.8.0",
    "trustme>=1.2.1,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "src",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -m 'not live' --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
markers = [
    "live: opt-in release canary that may call an explicitly configured external service",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
